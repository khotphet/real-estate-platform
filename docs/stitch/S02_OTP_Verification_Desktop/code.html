<!-- Micro-interaction script for digit auto-advance and countdown -->
<script>
    (function initOTP() {
      const inputs = Array.from(document.querySelectorAll('#otp-container input'));
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          const val = e.target.value;
          if (val.length >= 1) {
            e.target.value = val.slice(-1);
            if (index < inputs.length - 1) {
              inputs[index + 1].focus();
            }
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        input.addEventListener('focus', () => {
          input.select();
        });
      });

      // Countdown simulation
      let timeLeft = 54;
      const countdownEl = document.getElementById('countdown');
      const resendBtn = document.getElementById('resend-btn');

      const timer = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(timer);
          if (countdownEl) countdownEl.textContent = '00:00';
          if (resendBtn) {
            resendBtn.classList.remove('opacity-50', 'pointer-events-none');
          }
        } else if (countdownEl) {
          const seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
          countdownEl.textContent = `00:${seconds}`;
        }
      }, 1000);
    })();
  </script>
